name: Release on merge

on:
  push:
    branches:
      - main
    paths:
      - custom_components/singapore/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release from manifest version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from manifest
        id: version
        run: |
          VERSION=$(python - <<'PY'
          import json
          with open("custom_components/singapore/manifest.json", encoding="utf-8") as f:
              data = json.load(f)
          print(data["version"])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether tag already exists
        id: tag_check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists; skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # HACS installs this zip (hacs.json: zip_release + filename) instead of the source
      # archive, so GitHub counts every install and update: the README downloads badge.
      # Files sit at the zip's root; HACS extracts them into custom_components/singapore.
      - name: Build HACS zip
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git archive --format=zip -o singapore.zip "HEAD:custom_components/singapore"
          unzip -l singapore.zip | grep -q ' manifest.json$'

      - name: Create GitHub release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: singapore.zip
          fail_on_unmatched_files: true

      # With zip_release, HACS installs every version (including "Redownload" of an older
      # one) from its singapore.zip, so give each release that predates the zip one built
      # from its own tag. Idempotent: releases that already have the asset are skipped.
      - name: Attach HACS zip to older releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 1000 --json tagName --jq '.[].tagName' |
          while read -r tag; do
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx singapore.zip; then
              continue
            fi
            if ! git cat-file -e "$tag:custom_components/singapore/manifest.json" 2>/dev/null; then
              echo "::warning::$tag has no custom_components/singapore; skipped"
              continue
            fi
            git archive --format=zip -o /tmp/singapore.zip "$tag:custom_components/singapore"
            gh release upload "$tag" /tmp/singapore.zip
            echo "Attached singapore.zip to $tag"
          done
