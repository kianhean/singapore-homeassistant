blueprint:
  name: Singapore – lightning nearby
  description: >-
    Get a notification when NEA's lightning detection system records a strike
    closer to your home than a distance you choose. Uses the **NEA Nearest
    Lightning** sensor from the Singapore integration, which measures from the
    home location in Settings → System → General.
  domain: automation
  author: Singapore for Home Assistant
  source_url: https://github.com/kianhean/singapore-homeassistant/blob/main/blueprints/automation/singapore/lightning_nearby.yaml
  homeassistant:
    min_version: 2025.4.0
  input:
    lightning_sensor:
      name: Nearest lightning sensor
      default: sensor.nea_nearest_lightning
      selector:
        entity:
          filter:
            - integration: singapore
              domain: sensor
              device_class: distance
    distance:
      name: Distance
      description: >-
        Notify when the nearest strike is closer than this. NEA notes that most
        strikes fall within 5–6 km of a thunderstorm.
      default: 5
      selector:
        number:
          min: 1
          max: 30
          step: 0.5
          unit_of_measurement: km
    notify_action:
      name: Notify action
      description: >-
        The action that sends the notification, for example
        notify.mobile_app_your_phone. Leave as notify.notify to use the default.
      default: notify.notify
      selector:
        text: {}
    extra_actions:
      name: Extra actions (optional)
      description: Anything else to do, for example close the blinds.
      default: []
      selector:
        action: {}

mode: single
max_exceeded: silent

variables:
  lightning_sensor: !input lightning_sensor

triggers:
  - trigger: numeric_state
    entity_id: !input lightning_sensor
    below: !input distance

actions:
  - action: !input notify_action
    data:
      title: Lightning nearby
      message: >-
        Lightning {{ states(lightning_sensor) | float(0) | round(1) }} km away
        ({{ (state_attr(lightning_sensor, 'type') or 'unknown type') | replace('_', ' ') }})
  - choose: []
    default: !input extra_actions
