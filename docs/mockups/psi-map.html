<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="ha.css">
<style>
  body { padding: 20px; }
  .map { position: relative; height: 480px; background: #1a1c20; }
  .map svg.base { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mk { position: absolute; transform: translate(-50%, -50%); width: 46px; height: 46px; border-radius: 50%;
        border: 3px solid var(--c); background: color-mix(in srgb, var(--c) 35%, #1c1c1c);
        display: grid; place-items: center; font-weight: 600; font-size: 15px; color: #fff; }
  .zoom { position: absolute; left: 12px; top: 12px; background: #1c1c1c; border: 1px solid var(--border); border-radius: 6px; }
  .zoom div { width: 32px; height: 32px; display: grid; place-items: center; font-size: 20px; color: var(--text); }
  .zoom div + div { border-top: 1px solid var(--border); }
  .info { position: absolute; right: 16px; top: 16px; width: 250px; background: #232323; border: 1px solid var(--border);
          border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .info .hd { display: flex; align-items: center; gap: 10px; padding: 12px 14px 6px; }
  .info .hd b { font-size: 15px; font-weight: 500; }
  .info .big { padding: 2px 14px 6px; font-size: 30px; }
  .info .big small { font-size: 14px; color: var(--green); margin-left: 6px; }
  .info .rows .row { height: 30px; font-size: 13px; }
  .info .rows .label { color: var(--muted); }
  .credit { position: absolute; right: 6px; bottom: 4px; font-size: 10px; color: #777; }
</style></head>
<body>
<div class="card">
  <div class="card-title">Singapore PSI</div>
  <div class="map" id="map">
    <div class="zoom"><div>+</div><div>−</div></div>
    <div class="credit">Illustrative map</div>
  </div>
</div>
<script>
  // Rough, hand-traced outlines (lon, lat) — enough to read as Singapore at card size.
  const SG = [[103.605,1.322],[103.618,1.296],[103.645,1.300],[103.672,1.312],[103.700,1.300],[103.735,1.278],[103.765,1.272],
    [103.800,1.265],[103.835,1.262],[103.862,1.268],[103.878,1.287],[103.905,1.298],[103.935,1.305],[103.965,1.318],
    [103.990,1.330],[104.025,1.334],[104.042,1.356],[104.030,1.385],[104.000,1.392],[103.965,1.388],[103.935,1.398],
    [103.910,1.415],[103.885,1.420],[103.865,1.428],[103.835,1.452],[103.815,1.462],[103.790,1.455],[103.765,1.452],
    [103.740,1.446],[103.712,1.435],[103.690,1.425],[103.668,1.402],[103.650,1.380],[103.632,1.355],[103.615,1.340]];
  const JOHOR = [[103.55,1.36],[103.585,1.372],[103.615,1.395],[103.650,1.425],[103.690,1.442],[103.720,1.452],[103.760,1.462],[103.800,1.468],
    [103.840,1.464],[103.870,1.450],[103.900,1.436],[103.930,1.432],[103.965,1.430],[104.000,1.422],[104.050,1.424],[104.300,1.430],[104.3,1.55],[103.55,1.55]];
  const ISLANDS = [
    [[103.805,1.252],[103.825,1.245],[103.845,1.249],[103.838,1.258],[103.815,1.259]],                 // Sentosa
    [[103.940,1.405],[103.965,1.400],[103.990,1.407],[103.975,1.418],[103.950,1.418]],                 // Pulau Ubin
    [[103.660,1.270],[103.690,1.255],[103.722,1.258],[103.725,1.278],[103.700,1.290],[103.668,1.288]], // Jurong Island
    [[103.92,1.335],[103.94,1.33],[103.95,1.34]],
  ];
  const map = document.getElementById("map");
  const W = map.clientWidth, H = map.clientHeight;
  const lon0 = 103.575, lat1 = 1.488, k = W / (104.075 - 103.575);
  const P = ([lon, lat]) => [(lon - lon0) * k, (lat1 - lat) * k];
  const poly = (pts, fill) => `<polygon points="${pts.map((p) => P(p).join(",")).join(" ")}" fill="${fill}" stroke="#3b3e44" stroke-width="1"/>`;
  const label = (t, lon, lat, size = 11, col = "#7b7f86") => { const [x, y] = P([lon, lat]); return `<text x="${x}" y="${y}" fill="${col}" font-size="${size}" text-anchor="middle" font-family="Inter" letter-spacing=".06em">${t}</text>`; };
  // A few expressways for texture.
  const roads = [[[103.64,1.33],[103.74,1.35],[103.82,1.34],[103.90,1.33],[103.98,1.345]], [[103.77,1.45],[103.79,1.40],[103.84,1.33]], [[103.86,1.30],[103.89,1.36],[103.91,1.41]]];
  const road = (pts) => `<polyline points="${pts.map((p) => P(p).join(",")).join(" ")}" fill="none" stroke="#45484f" stroke-width="2"/>`;
  map.insertAdjacentHTML("afterbegin", `<svg class="base" viewBox="0 0 ${W} ${H}">
    ${poly(JOHOR, "#2a2c30")}${poly(SG, "#2f3237")}${ISLANDS.slice(0, 3).map((i) => poly(i, "#2f3237")).join("")}
    ${roads.map(road).join("")}
    ${label("JOHOR BAHRU", 103.77, 1.478, 12)}${label("Woodlands", 103.786, 1.438)}${label("Jurong", 103.70, 1.318)}
    ${label("Tampines", 103.955, 1.384)}${label("Changi", 104.005, 1.352)}${label("Sentosa", 103.83, 1.238)}
    ${label("Singapore Strait", 103.9, 1.24, 12, "#4d535c")}</svg>`);
  const psi = { north: [1.41803, 103.82, 35], south: [1.29587, 103.82, 40], east: [1.35735, 103.94, 42], west: [1.35735, 103.7, 38], central: [1.35735, 103.82, 39] };
  for (const [lat, lon, v] of Object.values(psi)) {
    const [x, y] = P([lon, lat]);
    map.insertAdjacentHTML("beforeend", `<div class="mk" style="left:${x}px;top:${y}px;--c:var(--green)">${v}</div>`);
  }
</script>
</body></html>
