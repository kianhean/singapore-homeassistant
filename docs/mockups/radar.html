<!doctype html>
<!-- Real NEA rain radar from data.gov.sg, rendered by fetch_radar.py with the
     integration's own radar_image.composite_radar (on NEA's base maps), in picture-entity
     cards laid out as in the README YAML. The 480 km camera (no map) is disabled by
     default, so it isn't shown. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="ha.css">
<style>
  body { padding: 20px; }
  .stack { display: grid; gap: 12px; }
  .g { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .cam { position: relative; overflow: hidden; }
  .cam img { width: 100%; display: block; }
  .cam .bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 14px; background: rgba(0,0,0,.55); font-size: 14px; font-weight: 500; color: #fff; }
</style></head>
<body>
<div class="heading" style="margin-bottom:8px"><i m="mdiRadar"></i>Rain radar</div>
<div class="stack">
  <div class="card cam"><img src="radar/70km.jpg" alt=""><div class="bar">Rain Radar 70 km</div></div>
  <div class="card cam"><img src="radar/240km.jpg" alt=""><div class="bar">Rain Radar 240 km</div></div>
</div>
</body></html>
