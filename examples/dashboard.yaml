# The dashboard in images/hero.jpg (its second view, Driving & parking, in
# images/carparks-taxis.png, and its third, Daily life, in images/daily-life.png),
# built only from Home Assistant's built-in cards.
#
# To use it: Settings → Dashboards → Add dashboard → New dashboard from scratch,
# open it, ⋮ → Edit dashboard → ⋮ → Raw configuration editor, and paste this in.
#
# Entity IDs are the ones a new install gets. Installs from before v0.3.0 use
# sensor.singapore_* IDs instead (see the README). Swap weather.weather_bedok for
# your own forecast area.
#
# The Driving & parking view needs four opt-in sources: tick "HDB carpark
# availability", "Taxi availability", "CapitaLand mall carparks" and "Pump
# prices (Caltex, SPC, Shell)" under Settings → Devices & services → Singapore →
# Configure, and swap the carpark numbers (B8B, B8, B6) and malls for yours.
# The Daily life view needs "Prayer times (MUIS)" ticked too; beach water
# quality is on by default.
title: Singapore
views:
  - title: Singapore
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Weather
            icon: mdi:weather-partly-cloudy
          - type: weather-forecast
            entity: weather.weather_bedok
            name: Bedok
            forecast_type: daily
            secondary_info_attribute: humidity
          - type: tile
            entity: sensor.weather_rainfall
            name: Rainfall
            color: blue
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.weather_wind_speed
            name: Wind speed
            color: teal
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.nea_uv_index
            name: UV index
            color: orange
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.nea_uv_exposure
            name: UV exposure
            color: orange
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.nea_heat_stress_wbgt
            name: WBGT
            color: deep-orange
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.nea_heat_stress
            name: Heat stress
            color: deep-orange
            grid_options: { columns: 6 }
          - type: tile
            entity: binary_sensor.nea_heavy_rain_warning
            name: Heavy rain
            color: blue
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.nea_weather_advisories
            name: Advisories
            color: amber
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.nea_next_tide
            name: Next tide
            color: cyan
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.nea_next_tide_level
            name: Tide level
            color: cyan
            grid_options: { columns: 6 }
          - type: heading
            heading: Air quality
            icon: mdi:air-filter
          - type: gauge
            entity: sensor.air_quality_psi
            name: PSI
            min: 0
            max: 300
            severity: { green: 0, yellow: 51, red: 201 }
          - type: tile
            entity: sensor.air_quality_pm2_5_1_hour
            name: PM2.5 (1-hour)
            color: green
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.air_quality_pm2_5
            name: PM2.5 (24-hour)
            color: green
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.air_quality_pm10
            name: PM10
            color: green
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.air_quality_ozone
            name: Ozone
            color: green
            grid_options: { columns: 6 }
          - type: entities
            title: PSI by region
            entities:
              - entity: sensor.air_quality_psi_north
                name: North
              - entity: sensor.air_quality_psi_south
                name: South
              - entity: sensor.air_quality_psi_east
                name: East
              - entity: sensor.air_quality_psi_west
                name: West
              - entity: sensor.air_quality_psi_central
                name: Central

      - type: grid
        cards:
          - type: heading
            heading: Getting around
            icon: mdi:train
          - type: tile
            entity: sensor.mrt_lrt_status
            name: MRT/LRT Status
            color: amber
          - type: entities
            entities:
              - entity: sensor.mrt_lrt_north_south_line_status
                name: North-South Line
              - entity: sensor.mrt_lrt_east_west_line_status
                name: East-West Line
              - entity: sensor.mrt_lrt_north_east_line_status
                name: North East Line
              - entity: sensor.mrt_lrt_circle_line_status
                name: Circle Line
              - entity: sensor.mrt_lrt_downtown_line_status
                name: Downtown Line
              - entity: sensor.mrt_lrt_thomson_east_coast_line_status
                name: Thomson-East Coast Line
          - type: tile
            entity: sensor.traffic_incidents
            name: Traffic incidents
            color: red
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.traffic_nearest_incident
            name: Nearest incident
            color: orange
            grid_options: { columns: 6 }
          - type: picture-entity
            entity: camera.traffic_cameras_woodlands_causeway
            name: Woodlands Causeway
            show_state: false
          - type: picture-entity
            entity: camera.traffic_cameras_tuas_checkpoint
            name: Tuas Checkpoint
            show_state: false
          - type: heading
            heading: Finance
            icon: mdi:finance
          - type: tile
            entity: sensor.finance_usd_sgd
            name: USD/SGD
            color: green
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.finance_eur_sgd
            name: EUR/SGD
            color: green
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.finance_100_jpy_sgd
            name: 100 JPY/SGD
            color: green
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.finance_myr_sgd
            name: MYR/SGD
            color: green
            grid_options: { columns: 6 }
          - type: entities
            title: Interest rates
            entities:
              - entity: sensor.finance_sora
                name: SORA
              - entity: sensor.finance_3_month_compounded_sora
                name: 3-month compounded SORA
              - entity: sensor.finance_1_year_t_bill_yield
                name: 1-year T-bill
              - entity: sensor.finance_10_year_sgs_bond_yield
                name: 10-year SGS bond

      - type: grid
        cards:
          - type: heading
            heading: Near home
            icon: mdi:home-outline
          - type: tile
            entity: sensor.nea_nearest_lightning
            name: Nearest lightning
            color: amber
          - type: tile
            entity: sensor.nea_nearest_dengue_cluster
            name: Nearest dengue cluster
            color: orange
          - type: tile
            entity: sensor.pub_flood_alerts
            name: PUB flood alerts
            color: blue
          - type: tile
            entity: calendar.hawker_centres_closures
            name: Hawker closures
            color: brown
            state_content: message
          - type: heading
            heading: Utilities
            icon: mdi:lightning-bolt
          - type: tile
            entity: sensor.energy_electricity_tariff
            name: Electricity
            color: yellow
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.energy_solar_export_price
            name: Solar export
            color: orange
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.energy_gas_tariff
            name: Gas
            color: red
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.energy_water_tariff
            name: Water
            color: blue
            grid_options: { columns: 6 }
          - type: heading
            heading: COE
            icon: mdi:car
          - type: entities
            entities:
              - entity: sensor.coe_category_a
                name: Category A
              - entity: sensor.coe_category_b
                name: Category B
              - entity: sensor.coe_category_c
                name: Category C
              - entity: sensor.coe_category_d
                name: Category D
              - entity: sensor.coe_category_e
                name: Category E

  - title: Driving & parking
    path: carparks-taxis
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Carparks near home
            icon: mdi:parking
          - type: tile
            entity: sensor.hdb_carparks_b8b
            name: Blk 222 Bedok North Drive
            color: indigo
          - type: tile
            entity: sensor.hdb_carparks_b8
            name: Blk 201/203 Bedok North Street 1
            color: indigo
          - type: tile
            entity: sensor.hdb_carparks_b6
            name: Blk 204/209 New Upper Changi Road
            color: indigo
          - type: entities
            title: Total car lots
            entities:
              - type: attribute
                entity: sensor.hdb_carparks_b8b
                attribute: car_lots_total
                name: Blk 222 Bedok North Drive
              - type: attribute
                entity: sensor.hdb_carparks_b8
                attribute: car_lots_total
                name: Blk 201/203 Bedok North Street 1
              - type: attribute
                entity: sensor.hdb_carparks_b6
                attribute: car_lots_total
                name: Blk 204/209 New Upper Changi Road

      - type: grid
        cards:
          - type: heading
            heading: CapitaLand malls
            icon: mdi:shopping
          - type: tile
            entity: sensor.capitaland_carparks_bedok_mall
            name: Bedok Mall
            color: purple
          - type: tile
            entity: sensor.capitaland_carparks_tampines_mall
            name: Tampines Mall
            color: purple
          - type: tile
            entity: sensor.capitaland_carparks_plaza_singapura
            name: Plaza Singapura
            color: purple
          - type: entities
            title: Total car lots
            entities:
              - type: attribute
                entity: sensor.capitaland_carparks_bedok_mall
                attribute: total_lots
                name: Bedok Mall
              - type: attribute
                entity: sensor.capitaland_carparks_tampines_mall
                attribute: total_lots
                name: Tampines Mall
              - type: attribute
                entity: sensor.capitaland_carparks_plaza_singapura
                attribute: total_lots
                name: Plaza Singapura

      - type: grid
        cards:
          - type: heading
            heading: Taxis
            icon: mdi:taxi
          - type: tile
            entity: sensor.taxis_nearby
            name: Free taxis within 1 km
            color: amber
          - type: tile
            entity: sensor.taxis_available
            name: Free taxis island-wide
            color: amber
          - type: entities
            title: Around home
            entities:
              - type: attribute
                entity: sensor.taxis_nearby
                attribute: within_500_m
                name: Within 500 m
                icon: mdi:map-marker-radius
              - type: attribute
                entity: sensor.taxis_nearby
                attribute: within_2_km
                name: Within 2 km
                icon: mdi:map-marker-radius
              - type: attribute
                entity: sensor.taxis_nearby
                attribute: nearest_km
                name: Nearest free taxi
                suffix: km
                icon: mdi:map-marker-distance

      - type: grid
        cards:
          - type: heading
            heading: Pump prices
            icon: mdi:gas-station
          - type: tile
            entity: sensor.caltex_95
            name: Caltex 95
            color: red
          - type: tile
            entity: sensor.spc_95
            name: SPC 95
            color: red
          - type: tile
            entity: sensor.shell_95
            name: Shell 95
            color: red
          - type: entities
            title: 98 and diesel
            entities:
              - entity: sensor.caltex_98
                name: Caltex 98
              - entity: sensor.spc_98
                name: SPC 98
              - entity: sensor.shell_98
                name: Shell 98
              - entity: sensor.caltex_diesel
                name: Caltex diesel
              - entity: sensor.spc_diesel
                name: SPC diesel
              - entity: sensor.shell_diesel
                name: Shell diesel
          - type: entities
            title: With discounts
            entities:
              - type: attribute
                entity: sensor.caltex_95
                attribute: discounted_price
                name: Caltex 95
                suffix: SGD/L
              - type: attribute
                entity: sensor.shell_95
                attribute: discounted_price
                name: Shell 95 (all discounts)
                suffix: SGD/L

  - title: Daily life
    path: daily-life
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Prayer times
            icon: mdi:mosque
          - type: tile
            entity: sensor.prayer_times_next_prayer
            name: Next prayer
            color: teal
            state_content:
              - prayer
              - state
          - type: entities
            title: Today
            entities:
              - entity: sensor.prayer_times_subuh
                name: Subuh
                format: time
              - entity: sensor.prayer_times_syuruk
                name: Syuruk
                format: time
              - entity: sensor.prayer_times_zohor
                name: Zohor
                format: time
              - entity: sensor.prayer_times_asar
                name: Asar
                format: time
              - entity: sensor.prayer_times_maghrib
                name: Maghrib
                format: time
              - entity: sensor.prayer_times_isyak
                name: Isyak
                format: time

      - type: grid
        cards:
          - type: heading
            heading: Beach water quality
            icon: mdi:beach
          - type: tile
            entity: sensor.beaches_east_coast
            name: East Coast
            color: cyan
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.beaches_sentosa
            name: Sentosa
            color: cyan
            grid_options: { columns: 6 }
          - type: entities
            title: All beaches
            entities:
              - entity: sensor.beaches_changi
                name: Changi
              - entity: sensor.beaches_pasir_ris
                name: Pasir Ris
              - entity: sensor.beaches_punggol
                name: Punggol
              - entity: sensor.beaches_seletar
                name: Seletar Island
              - entity: sensor.beaches_sembawang
                name: Sembawang Park
          - type: markdown
            content: >-
              {{ state_attr('sensor.beaches_east_coast', 'advisory') }}:
              {{ state_attr('sensor.beaches_east_coast', 'advice') }}
              Week of {{ state_attr('sensor.beaches_east_coast', 'week_start') }}.
